{{define "content"}}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">Operator Metrics</h1>
</div>

<div class="row g-3">
    {{range .Panels}}
    <div class="col-12 col-xl-6">
        <div class="card h-100 p-4">
            <div class="d-flex justify-content-between align-items-start gap-3">
                <div>
                    <h2 class="h5 mb-2">{{.Title}}</h2>
                    <div class="fs-4 fw-semibold">{{.Primary}}</div>
                </div>
                <span class="badge {{.Badge}} text-uppercase">{{.Status}}</span>
            </div>
            <p class="text-muted small mt-2 mb-3">{{.Detail}}</p>
            {{if .Rows}}
            <div class="table-responsive">
                <table class="table table-sm align-middle mb-0">
                    <tbody>
                        {{range .Rows}}
                        <tr>
                            <td class="fw-semibold">{{.Name}}</td>
                            <td>{{.Primary}}</td>
                            <td class="text-muted small">{{.Detail}}</td>
                            <td class="text-end"><span class="badge {{.Badge}} text-uppercase">{{.Status}}</span></td>
                        </tr>
                        {{end}}
                    </tbody>
                </table>
            </div>
            {{end}}
        </div>
    </div>
    {{end}}
</div>
{{end}}
