{{define "content"}}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">System Logs</h1>
    <div class="d-flex align-items-center">
        <label for="log-level-filter" class="me-2 mb-0 small text-muted">Level</label>
        <select
            id="log-level-filter"
            name="level"
            class="form-select form-select-sm"
            style="width: auto;"
            hx-get="/dash/logs?partial=true"
            hx-target="#log-tail-container"
            hx-swap="innerHTML"
        >
            <option value="" {{if eq .Level ""}}selected{{end}}>All</option>
            <option value="DEBUG" {{if eq .Level "DEBUG"}}selected{{end}}>DEBUG</option>
            <option value="INFO" {{if eq .Level "INFO"}}selected{{end}}>INFO</option>
            <option value="WARN" {{if eq .Level "WARN"}}selected{{end}}>WARN</option>
            <option value="ERROR" {{if eq .Level "ERROR"}}selected{{end}}>ERROR</option>
        </select>
    </div>
</div>

<div class="card">
    <div
        class="card-body p-0"
        id="log-tail-container"
        hx-get="/dash/logs?partial=true&level={{.Level}}"
        hx-trigger="load, every 5s"
        hx-swap="innerHTML"
    >
        {{template "log_tail" .}}
    </div>
</div>
{{end}}

{{define "log_tail"}}
<pre class="mb-0 p-3 bg-dark text-light small" style="max-height: 70vh; overflow-y: auto; white-space: pre-wrap;">{{.LogTail}}</pre>
{{end}}
