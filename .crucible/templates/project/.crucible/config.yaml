# Project-level Crucible configuration.
# Copy this directory to <project-root>/.crucible and adjust values for the project.

# Crucible bundle root directory for this project.
# This must point to the folder containing the installed Crucible framework bundle.
crucible_root: ".crucible"

# Optional: stamped by init-project.ps1 at install time. Lets you see at a glance
# which Crucible version/commit this project was installed from, and reason about
# drift when pulling upstream updates. Safe to delete if you don't want this metadata.
crucible_version: "REPLACE_WITH_VERSION"
crucible_install_commit: "REPLACE_WITH_COMMIT"

project:
  name: "Example Project"
  description: "Replace with a short description of the target project."
  default_branch: "main"

roles:
  researcher:
    model_tier: fast
  groomer:
    model_tier: fast
  architect:
    model_tier: high-capability
  reviewer:
    model_tier: high-capability
  operator:
    model_tier: high-capability

# Concrete models per CLI target and capability tier. Crucible computes an abstract tier
# (strong / default / light) from the phase, budget_tier, and design_required, then resolves
# it here for the active -Target (claude | codex | antigravity | grok; 'agent' uses the
# claude row). grok's 'inherit' means omit model: the specialist inherits the session.
# Edit these as providers release new models -- this is the single source of truth the
# [RECOMMENDED MODEL] line reads. Quote any value containing spaces.
# NOTE: gpt-6-sol, gpt-5.6-terra, and gpt-6-luna passed launch-codex-specialist.ps1 -Preflight
# on ChatGPT login on 2026-09-28. Preflight the exact slug for the running account.
# gpt-6-astra, like Claude Fable, is for evaluation work, not a pipeline tier.
# Each Codex tier is a rung, a model plus an effort (strong sol/high, default terra/medium,
# light luna/high). An optional effort.codex.<tier> block changes the effort half.
models:
  default_target: claude
  targets:
    claude:
      strong: opus
      default: sonnet
      light: haiku
    codex:
      strong: gpt-6-sol
      default: gpt-5.6-terra
      light: gpt-6-luna
    antigravity:
      strong: "Gemini 3.1 Pro (High)"
      default: "Gemini 3.8 Flash (High)"
      light: "Gemini 3.8 Flash (Medium)"
    grok:
      strong: inherit
      default: inherit
      light: inherit

verification:
  quick:
    - name: test
      command: replace-with-project-quick-test-command
  full:
    - name: test
      command: replace-with-project-full-test-command

project_mandates:
  - Replace with project-specific engineering rules.

file_affinity_examples:
  - src/

# Language manifest/lock files allowed to change as build side-effects
# manifest_files:
#   - package.json
#   - package-lock.json

# Configuration for the human review gate (diff tool / editor).
# Optional. Default is text-only git diff command.
# review:
#   diff_tool: zed      # Options: zed, code, etc.
#   editor: zed         # Options: zed, code, etc. (defaults to diff_tool if unset)
#   auto_push: false
#   require_green_ci: false
#   ci_timeout_minutes: 20
