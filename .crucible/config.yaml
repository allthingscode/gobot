# Example project-level Crucible configuration for Gobot.
# This file is what a project would place at .crucible/config.yaml.

# Crucible bundle root directory for this project.
# This must point to the folder containing the installed Crucible framework bundle.
crucible_root: ".crucible"

project:
  name: Gobot
  description: Go-based Telegram bot used as the reference application for Crucible.
  default_branch: master

paths:
  backlog: .crucible/backlog
  session: .crucible/session
  workspaces: .crucible/.agent-workspaces
  prompts: .crucible/prompts
  personas: .crucible/personas
  sops: .crucible/sops

roles:
  researcher:
    model_tier: fast
  groomer:
    model_tier: fast
  architect:
    model_tier: high-capability
  reviewer:
    model_tier: high-capability
  operator:
    model_tier: fast

# Concrete models per CLI target and capability tier. The factory computes an abstract tier
# (strong / default / light) from the phase, budget_tier, and design_required, then resolves
# it here for the active -Target (claude | codex | antigravity; 'agent' uses the claude row).
# Edit these as providers release new models -- this is the single source of truth the
# [RECOMMENDED MODEL] line reads. Quote any value containing spaces.
models:
  default_target: claude
  targets:
    claude:
      strong: opus
      default: sonnet
      light: haiku
    codex:
      strong: gpt-5.5
      default: gpt-5.5
      light: gpt-5.4
    antigravity:
      strong: "Gemini 3.1 Pro (High)"
      default: "Gemini 3.5 Flash (High)"
      light: "Gemini 3.5 Flash (Medium)"

verification:
  quick:
    - name: go test
      command: go test -mod=readonly ./internal/... ./cmd/...
  full:
    - name: go vet
      command: go vet -mod=readonly ./internal/... ./cmd/...
    - name: golangci-lint
      command: golangci-lint run --modules-download-mode=readonly ./internal/... ./cmd/...
    - name: tests
      command: gotestsum --format testdox -- -mod=readonly ./internal/... ./cmd/...
    - name: doc lint
      command: go run scripts/doc_lint.go
    - name: mod-tidy
      command: go mod tidy -diff
  config_check:
    name: config reformat check
    command: go run -mod=readonly ./cmd/gobot config reformat --check config.sample.json

project_mandates:
  - Pure Go only; no CGO.
  - Persist durable state through SQLite.
  - Wrap errors with context.
  - Use structured logging.
  - No panic in internal packages.

file_affinity_examples:
  - internal/app/
  - internal/agent/
  - cmd/gobot/

# Language manifest files allowed to change as build side-effects (scope-gate bypass).
manifest_files:
  - go.mod
  - go.sum

# Human review gate: open the diff/worktree in Zed (see C-323 review-UX fix).
review:
  diff_tool: zed
  editor: zed
  require_green_ci: true
crucible_version: "0.3.4"
crucible_install_commit: "950f80cfd7f305966a5005ad48d16a912e557727"

