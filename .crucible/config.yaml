# Example project-level Crucible configuration for Gobot.
# This file is what a project would place at .crucible/config.yaml.

# Crucible bundle root directory for this project.
# This must point to the folder containing the installed Crucible framework bundle.
crucible_root: ".crucible"

hooks:
  project_dir: scripts/hooks

project:
  name: Gobot
  description: Go-based Telegram bot used as the reference application for Crucible.
  default_branch: master

paths:
  backlog: .crucible/backlog
  session: .crucible/session
  workspaces: .crucible/.agent-workspaces
  prompts: .crucible/prompts
  personas: .crucible/personas
  sops: .crucible/sops

roles:
  researcher:
    model_tier: fast
  groomer:
    model_tier: fast
  architect:
    model_tier: high-capability
  reviewer:
    model_tier: high-capability
  operator:
    model_tier: fast

# Concrete models per CLI target and capability tier. The factory computes an abstract tier
# (strong / default / light) from the phase, budget_tier, and design_required, then resolves
# it here for the active -Target (claude | codex | antigravity; 'agent' uses the claude row).
# Edit these as providers release new models -- this is the single source of truth the
# [RECOMMENDED MODEL] line reads. Quote any value containing spaces. A codex tier is a
# level, a model and an effort together.
models:
  default_target: claude
  targets:
    claude:
      strong:
        model: claude-opus-5-5
        effort: medium
      default:
        model: claude-sonnet-5-5
        effort: high
      light:
        model: claude-haiku-5-5
        effort: high
      researcher:
        model: claude-opus-5-5
        effort: high
    codex:
      strong:
        model: gpt-6.2-sol
        effort: high
      default:
        model: gpt-6.1-terra
        effort: high
      light:
        model: gpt-6-luna
        effort: high
    antigravity:
      strong: "Gemini 4 Neon (High)"
      default: "Gemini 4 Hydrogen (High)"
      light: "Gemini 4 Hydrogen (Medium)"

verification:
  quick:
    - name: go test
      command: go test -mod=readonly ./internal/... ./cmd/...
  full:
    - name: go vet
      command: go vet -mod=readonly ./internal/... ./cmd/...
    - name: scoped coverage
      command: >-
        $threshold = 80.0; $coverageDir = if ($env:CRUCIBLE_SCRATCH_DIR) { $env:CRUCIBLE_SCRATCH_DIR } else { "artifacts" }; New-Item -ItemType Directory -Force $coverageDir | Out-Null; $coveragePath = Join-Path $coverageDir "coverage.out"; go test -mod=readonly -coverprofile $coveragePath ./internal/... ./cmd/...; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; $oldGOFLAGS = $env:GOFLAGS; try { $env:GOFLAGS = (($oldGOFLAGS, "-mod=readonly") | Where-Object { $_ }) -join " "; $coverageOutput = go tool cover -func $coveragePath; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } } finally { $env:GOFLAGS = $oldGOFLAGS }; $coverageOutput; $coverage = [double](($coverageOutput | Select-String '^total:' | ForEach-Object { ($_ -split '\s+')[-1].TrimEnd('%') })); $coverageText = $coverage.ToString("F1"); Write-Host ("Total coverage: {0}%" -f $coverageText); if ($coverage -lt $threshold) { Write-Host ("Coverage {0}% is below {1}% threshold" -f $coverageText, $threshold.ToString("F1")); exit 1 }
    - name: golangci-lint
      command: golangci-lint run --modules-download-mode=readonly ./internal/... ./cmd/...
    - name: tests
      command: gotestsum --format testdox -- -mod=readonly ./internal/... ./cmd/...
    - name: race tests
      host_gate: cgo
      alternative_runner: wsl --cd "$PWD" -e bash -lc "CGO_ENABLED=1 GOFLAGS=-buildvcs=false go test -race -mod=readonly ./internal/... ./cmd/..."
      command: go test -race -mod=readonly ./internal/... ./cmd/...
    - name: doc lint
      command: go run -mod=readonly scripts/doc_lint.go
    - name: mod-tidy
      command: go mod tidy -diff
  config_check:
    name: config reformat check
    command: go run -mod=readonly ./cmd/gobot config reformat --check config.sample.json

project_mandates:
  - Pure Go only; no CGO.
  - Persist durable state through SQLite.
  - Wrap errors with context.
  - Use structured logging.
  - No panic in internal packages.

file_affinity_examples:
  - internal/app/
  - internal/agent/
  - cmd/gobot/

# Language manifest files allowed to change as build side-effects (scope-gate bypass).
manifest_files:
  - go.mod
  - go.sum

# Human review gate: open the diff/worktree in Zed (see C-323 review-UX fix).
review:
  diff_tool: zed
  editor: zed
  auto_push: false
  require_green_ci: true
crucible_version: "0.5.0"
crucible_install_commit: "7eee72d2954f36daad6fb9b229ea7476aea3cca9"
