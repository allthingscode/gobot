name: CI

on:
    push:
        branches: ["**"]
    pull_request:
        branches: ["**"]

    workflow_dispatch:
    schedule:
        - cron: '17 6 * * *'

jobs:
    lint:
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v7
            -   uses: actions/setup-go@v6
                with:
                    go-version-file: go.mod
                    cache: true
            -   name: golangci-lint
                uses: golangci/golangci-lint-action@v9
                with:
                    version: v2.11.4
                    args: --modules-download-mode=readonly

    vuln-check:
        permissions:
            contents: read
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        env:
            GOARCH: amd64
            CGO_ENABLED: '0'
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-go@v6
              with:
                  go-version-file: go.mod
                  cache: true
            - name: Offline security helper tests
              shell: pwsh
              run: pwsh -NoProfile -File scripts/check_security_test.ps1
            - name: Windows PowerShell compatibility
              if: runner.os == 'Windows'
              shell: powershell
              run: powershell.exe -NoProfile -File scripts/check_security_test.ps1
            - name: Scan production sources
              shell: pwsh
              run: ./scripts/check_security.ps1

    version-check:
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v7
            -   uses: actions/setup-go@v6
                with:
                    go-version-file: go.mod
                    cache: true
            -   name: Check Go version alignment
                run: go run scripts/check_go_version_alignment/main.go


    test:
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            -   uses: actions/checkout@v7

            -   name: Set up Go
                uses: actions/setup-go@v6
                with:
                    go-version-file: go.mod
                    cache: true

            -   name: Vet
                run: go vet -mod=readonly ./internal/... ./cmd/...

            -   name: Test
                run: go test -race -mod=readonly ./internal/... ./cmd/...

    mod-tidy:
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v7
            -   uses: actions/setup-go@v6
                with:
                    go-version-file: go.mod
                    cache: true
            -   name: Verify go mod tidy
                run: |
                    go mod tidy
                    git diff --exit-code go.mod go.sum

    coverage:
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v7
            -   uses: actions/setup-go@v6
                with:
                    go-version-file: go.mod
                    cache: true
            -   name: Coverage check
                run: |
                    mkdir -p artifacts
                    COVERAGE_PROFILE="artifacts/coverage.out"
                    COVERAGE_THRESHOLD="80.0"
                    go test -mod=readonly -coverprofile "${COVERAGE_PROFILE}" ./internal/... ./cmd/...
                    go tool cover -func "${COVERAGE_PROFILE}"
                    COVERAGE=$(go tool cover -func "${COVERAGE_PROFILE}" | grep total | awk '{print $3}' | tr -d '%')
                    echo "Total coverage: ${COVERAGE}%"
                    awk "BEGIN { if (${COVERAGE} < ${COVERAGE_THRESHOLD}) { print \"Coverage ${COVERAGE}% is below ${COVERAGE_THRESHOLD}% threshold\"; exit 1 } }"

    coverage-windows:
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        runs-on: windows-latest
        defaults:
            run:
                shell: bash
        steps:
            -   uses: actions/checkout@v7
            -   uses: actions/setup-go@v6
                with:
                    go-version-file: go.mod
                    cache: true
            -   name: Windows Coverage run
                run: |
                    mkdir -p artifacts
                    go test -mod=readonly -coverprofile artifacts/coverage-windows.out ./internal/... ./cmd/...
                    go tool cover -func artifacts/coverage-windows.out
            -   name: Upload Windows Coverage Artifact
                uses: actions/upload-artifact@v7
                continue-on-error: true
                with:
                    name: coverage-windows
                    path: artifacts/coverage-windows.out

    doc-lint:
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v7
            -   uses: actions/setup-go@v6
                with:
                    go-version-file: go.mod
                    cache: true
            -   name: Documentation Lint
                run: go run scripts/doc_lint.go

    bench:
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v7
            -   uses: actions/setup-go@v6
                with:
                    go-version-file: go.mod
                    cache: true
            -   name: Run benchmarks
                run: |
                    mkdir -p artifacts
                    go test -mod=readonly -bench=. -benchmem -run='^$' ./internal/... ./cmd/... | tee artifacts/bench.txt
            -   name: Upload benchmark results
                uses: actions/upload-artifact@v7
                with:
                    name: bench-${{ github.sha }}
                    path: artifacts/bench.txt

    config-check:
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v7
            -   uses: actions/setup-go@v6
                with:
                    go-version-file: go.mod
                    cache: true
            -   name: Check config.sample.json format
                run: go run -mod=readonly ./cmd/gobot config reformat --check config.sample.json
            -   name: Validate config.sample.json
                run: |
                    mkdir -p ~/gobot_data/workspace
                    touch ~/gobot_data/workspace/AWARENESS.md
                    go run -mod=readonly ./cmd/gobot config validate config.sample.json
